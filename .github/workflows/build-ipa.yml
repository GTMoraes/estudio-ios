name: Gerar IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write        # para publicar o IPA em Releases

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode mais novo
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache dos codificadores de áudio (MP3/OGG)
        uses: actions/cache@v4
        with:
          path: vendor
          key: codificadores-${{ hashFiles('scripts/compilar-codificadores.sh') }}

      - name: Compilar LAME e Vorbis para iPhone
        run: |
          bash scripts/compilar-codificadores.sh
          # sem isto o Xcode só reclama lá na frente ("lame/lame.h file not found")
          for f in vendor/include/lame/lame.h vendor/include/vorbis/vorbisenc.h vendor/include/ogg/ogg.h \
                   vendor/lib/libmp3lame.a vendor/lib/libvorbisenc.a vendor/lib/libvorbis.a vendor/lib/libogg.a; do
            [ -f "$f" ] || { echo "::error::faltou $f"; exit 1; }
          done
          echo "codificadores OK"

      - name: Cache do FFmpeg (leitura e decodificação de qualquer formato)
        uses: actions/cache@v4
        with:
          path: vendor-ff
          key: ffmpeg-${{ hashFiles('scripts/compilar-ffmpeg.sh') }}

      - name: Compilar o FFmpeg para iPhone
        run: bash scripts/compilar-ffmpeg.sh

      - name: Gerar o projeto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project Estudio.xcodeproj -scheme Estudio \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Empacotar o IPA (assinatura provisória com as permissões)
        run: |
          APP=build/Build/Products/Release-iphoneos/Estudio.app
          ls "$APP" "$APP/PlugIns"
          codesign --force --sign - --entitlements Compartilhar/Compartilhar.entitlements "$APP/PlugIns/Compartilhar.appex"
          codesign --force --sign - --entitlements App/Estudio.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Estudio.ipa Payload
          ls -la Estudio.ipa

      - name: Publicar o IPA em Releases (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Estúdio — build ${{ github.run_number }}
          body: |
            Commit ${{ github.sha }}
            Link fixo para a versão mais nova:
            https://github.com/${{ github.repository }}/releases/latest/download/Estudio.ipa
          files: Estudio.ipa
          make_latest: true

      - name: Link do IPA
        run: |
          echo "### Estudio.ipa" >> $GITHUB_STEP_SUMMARY
          echo "Desta build: https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Estudio.ipa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sempre a mais nova: https://github.com/${{ github.repository }}/releases/latest/download/Estudio.ipa" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-ipa
          path: Estudio.ipa

      - name: Resumo dos erros (se falhar)
        if: failure()
        run: grep -n "error:" xcodebuild.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
