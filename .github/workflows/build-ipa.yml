name: Gerar IPA

on:
  push:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode mais novo
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Gerar o projeto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild -project Estudio.xcodeproj -scheme Estudio \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Empacotar o IPA (assinatura provisória com as permissões)
        run: |
          APP=build/Build/Products/Release-iphoneos/Estudio.app
          ls "$APP" "$APP/PlugIns"
          codesign --force --sign - --entitlements Compartilhar/Compartilhar.entitlements "$APP/PlugIns/Compartilhar.appex"
          codesign --force --sign - --entitlements App/Estudio.entitlements "$APP"
          codesign -d --entitlements - "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Estudio.ipa Payload
          ls -la Estudio.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Estudio-ipa
          path: Estudio.ipa

      - name: Resumo dos erros (se falhar)
        if: failure()
        run: grep -n "error:" xcodebuild.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
